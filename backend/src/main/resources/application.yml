spring:
  application:
    name: ipa-undanganku

  datasource:
    url: jdbc:postgresql://103.93.129.174:5432/undanganku
    username: myuser
    password: P@ssw0rd
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    out-of-order: false

  threads:
    virtual:
      enabled: true

server:
  servlet:
    context-path: /ipa-undanganku
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000  # 15 minutes in milliseconds
  algorithm: HS256

logging:
  level:
    root: INFO
    id.co.bankmandiri.ep.undanganku: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

