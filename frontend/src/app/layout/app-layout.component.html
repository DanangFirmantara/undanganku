<div class="flex h-screen bg-gray-100">
  <!-- Sidebar -->
  <aside
    class="w-64 bg-gray-900 text-white transition-all duration-300"
    [class.hidden]="!sidebarOpen"
  >
    <div class="p-6 border-b border-gray-700">
      <h1 class="text-xl font-bold">{{APP_NAME}}</h1>
    </div>

    <nav class="mt-6">
      <a
        routerLink="/app/dashboard/user"
        routerLinkActive="bg-gray-700"
        class="block px-6 py-3 hover:bg-gray-800 transition"
      >
        Dashboard
      </a>

      @if (isAdmin(authService.currentUser())) {
        <a
          routerLink="/app/dashboard/admin"
          routerLinkActive="bg-gray-700"
          class="block px-6 py-3 hover:bg-gray-800 transition"
        >
          Admin Dashboard
        </a>

        <a
          routerLink="/app/users"
          routerLinkActive="bg-gray-700"
          class="block px-6 py-3 hover:bg-gray-800 transition"
        >
          User Management
        </a>
      }
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow">
      <div class="px-6 py-4 flex justify-between items-center">
        <button
          (click)="toggleSidebar()"
          class="text-gray-600 hover:text-gray-900"
        >
          ☰
        </button>

        <div class="flex items-center gap-4">
          @if (authService.currentUser(); as user) {
            <span class="text-gray-700">
              {{ user.firstName }} {{ user.lastName }}
            </span>
          }

          <button
            (click)="logout()"
            class="btn btn-secondary"
          >
            Logout
          </button>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-auto p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
